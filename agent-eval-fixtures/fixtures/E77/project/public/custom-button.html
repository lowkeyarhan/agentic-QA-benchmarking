<!DOCTYPE html>
<html>
<head>
  <title>Custom Button Test</title>
  <style>
    .btn {
      padding: 15px 30px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      cursor: pointer;
    }
    .btn:hover { background: #0056b3; }
    #result { 
      margin-top: 20px; 
      padding: 15px;
      font-weight: bold;
      display: none;
    }
    #result.show {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Custom Button with Dynamic ID</h1>
  
  <button 
    class="btn" 
    id="submit-btn-ABCDE" 
    cursor="pointer"
    onclick="submitForm()">
    Submit Form
  </button>
  
  <div id="result"></div>
  
  <script>
    // Generate random ID on each load
    document.querySelector('.btn').id = 'submit-btn-' + 
      Math.random().toString(36).substring(2, 7).toUpperCase();
    
    function submitForm() {
      const result = document.getElementById('result');
      result.textContent = 'Form submitted successfully!';
      result.classList.add('show');
    }
  </script>
</body>
</html>
